name: "Serial2MQTT Bridge"
version: "1.0.0"
slug: "serial2mqtt"
description: "Bridge serial port devices to MQTT for Eclipse OS and other microcontrollers"
arch:
  - armhf
  - armv7
  - aarch64
  - amd64
  - i386
startup: application
boot: auto
uart: true
hassio_api: true
homeassistant_api: false
options:
  serial_port: "/dev/ttyACM0"
  baud_rate: 9600
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  topic_prefix: "dst"
schema:
  serial_port: str
  baud_rate: int
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  topic_prefix: str
image: "ghcr.io/{arch}-addon-serial2mqtt"
